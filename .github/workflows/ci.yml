name: CI

on:
  push:
    branches: [Main, Develop]
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Green gate: builds both targets and runs every test that SHOULD pass
  # on a correct core. Failure here blocks merges.
  # -----------------------------------------------------------------------
  gate:
    name: Build & test (${{ matrix.os }} / ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [clang, gcc]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ncurses pkg-config
          # Homebrew ncurses is keg-only; let pkg-config surface it.
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/ncurses/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set compiler
        run: echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Build everything & run green-gate tests
        run: make ci

  # -----------------------------------------------------------------------
  # Known-issues: the tests that currently FAIL because of diagnosed bugs
  # (65C02 NOP lengths, missing undocumented opcodes). Surfaced so the
  # "last 10%" stays visible, but does NOT block merges.
  # -----------------------------------------------------------------------
  known-issues:
    name: Known-failing tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev pkg-config python3

      - name: Run the known-failing test suite
        run: make known-issues || true

      - name: Summary
        run: |
          echo "::notice::undocumented_test and 65C02_extended are expected to fail today."
          echo "See the diagnostic report for the fix roadmap."
